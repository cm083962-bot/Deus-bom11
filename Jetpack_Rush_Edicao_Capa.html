<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jetpack Rush</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{background:#080d13}
body{background:#080d13;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;flex-direction:column;padding:18px;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
header{width:min(100%,1000px);margin-bottom:14px}
h1{font-size:clamp(26px,5vw,42px);color:#ffbd43;text-shadow:0 0 18px #ff7b22}
.sub{font-size:12px;color:#a8bac5;letter-spacing:2px;margin-top:5px}
.box{width:min(100%,1000px);position:relative;overflow:hidden;border:3px solid #8999a2;border-radius:10px;box-shadow:0 18px 55px #000d, inset 0 0 24px #8ddfff22}
canvas{width:100%;display:block;aspect-ratio:1000/562;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:7px;pointer-events:none}
.hud div{background:#101923e8;border:1px solid #ffffff35;padding:9px 13px;border-radius:8px;font-size:14px}
.hud b{color:#ffc34c}
button{border:2px solid #ffe18a;border-radius:11px;padding:13px 27px;background:linear-gradient(180deg,#ffe45b,#ff9d18 72%,#d95a13);color:#17202a;font-weight:1000;font-size:17px;letter-spacing:1px;cursor:pointer;margin:4px;box-shadow:0 5px 0 #843d18,0 0 24px #ff9b2b66;text-shadow:0 1px #fff6}
button:hover{filter:brightness(1.15)}
#pause{position:absolute;top:58px;right:12px;display:none;padding:8px 13px;font-size:12px}
.overlay{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;text-align:center;padding:15px;background:linear-gradient(180deg,#06101b88,#06101bdc)}
.panel{max-width:520px;padding:24px 28px;border:1px solid #ffffff25;border-radius:18px;background:linear-gradient(145deg,#142638dd,#07111de8);box-shadow:0 12px 40px #0009}
.panel h2{font-size:clamp(34px,7vw,62px);font-style:italic;font-weight:1000;letter-spacing:2px;color:#ffb52e;margin-bottom:12px;text-shadow:3px 4px 0 #9d3214,0 0 22px #ff791e}
.panel p{color:#d7e0e8;line-height:1.6;margin-bottom:20px}
.ins{margin-top:13px;color:#aab9c9;font-size:13px;text-align:center}
@media(max-width:600px){body{padding:8px}.hud div{padding:6px;font-size:11px}}
</style>
</head>
<body>
<header><h1>JETPACK RUSH</h1><div class="sub">JETPACK RUSH • ROCKETS • LASERS • GOLD RUSH</div></header>
<div class="box">
<canvas id="game" width="1000" height="562"></canvas>
<div class="hud"><div>⭐ <b id="score">0</b></div><div>🪙 <b id="coins">0</b></div><div>🏆 <b id="record">0</b></div></div>
<button id="pause">Ⅱ PAUSAR</button>
<div class="overlay" id="overlay"><div class="panel">
<h2 id="title">JETPACK RUSH</h2>
<p id="message">ATRAVESSE A FÁBRICA! Voe com sua mochila a jato, desvie dos lasers e foguetes e colete moedas douradas.</p>
<button id="start">INICIAR FUGA</button>
</div></div>
</div>
<div class="ins">SEGURE ESPAÇO OU CLIQUE PARA VOAR • SOLTE PARA DESCER E CORRER • DESVIE DOS LASERS E FOGUETES • ESC PAUSA</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=1000,H=562,FLOOR=475,GY=FLOOR-39;
const $=id=>document.getElementById(id);
const overlay=$("overlay"),pauseBtn=$("pause");
let player,obstacles=[],coins=[],particles=[],bullets=[];
let score=0,money=0,speed=5,frame=0,world=0,lastTime=0;
let playing=false,paused=false,flying=false;
let record=0;
try{record=Number(localStorage.getItem("factoryRecord")||0)}catch(e){}
$("record").textContent=record;

/* ---------- FUNDO: FÁBRICA NO ESTILO DA CAPA ---------- */
function drawBackground(){
  let g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#101b2b");g.addColorStop(.48,"#263d55");g.addColorStop(1,"#111c29");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // vigas e teto metálico
  for(let i=0;i<9;i++){
    let x=i*135-(world*.22%135);
    ctx.fillStyle="#0b1420";ctx.fillRect(x,0,105,42);
    ctx.fillStyle="#425366";ctx.fillRect(x,37,105,8);
    ctx.fillStyle="#1b2a3a";ctx.fillRect(x+8,8,88,23);
    ctx.fillStyle="#ffbf42";ctx.shadowColor="#ff9b26";ctx.shadowBlur=18;
    ctx.fillRect(x+24,49,58,5);ctx.shadowBlur=0;
  }

  // parede azul escura e painéis
  let wall=ctx.createLinearGradient(0,80,0,430);
  wall.addColorStop(0,"#30465d");wall.addColorStop(.55,"#20384f");wall.addColorStop(1,"#172b3e");
  ctx.fillStyle=wall;ctx.fillRect(0,80,W,360);
  for(let x=0;x<W+120;x+=120){
    let px=x-world*.32%120;
    ctx.fillStyle="#344b62";ctx.fillRect(px,90,5,340);
    ctx.fillStyle="#101f30";ctx.fillRect(px+8,100,102,4);
    ctx.fillStyle="#71879a";ctx.beginPath();ctx.arc(px+14,112,3,0,7);ctx.arc(px+102,112,3,0,7);ctx.fill();
  }

  // janelas industriais azuladas
  for(let i=0;i<6;i++){
    let x=55+i*205-(world*.18%205);
    ctx.fillStyle="#0b1b2a";ctx.fillRect(x,160,112,92);
    let wg=ctx.createLinearGradient(x,160,x,252);
    wg.addColorStop(0,"#5b9bb9");wg.addColorStop(1,"#244c6b");
    ctx.fillStyle=wg;ctx.fillRect(x+7,167,98,78);
    ctx.fillStyle="#a6d8e8";ctx.globalAlpha=.28;ctx.fillRect(x+10,170,90,8);ctx.globalAlpha=1;
    ctx.strokeStyle="#8ba0b0";ctx.lineWidth=6;ctx.strokeRect(x,160,112,92);
    ctx.fillStyle="#20384e";ctx.fillRect(x+52,163,5,86);
  }

  // tubulações e suportes
  pipe(-(world*.55)%1100,105,22,"#aab8c2");
  pipe(-(world*.45)%1100+500,285,16,"#778d9e");

  // silhuetas de máquinas ao fundo, sem bloquear o jogador
  for(let i=0;i<8;i++){
    let x=((i*165-world*.72)%1450+1450)%1450-180;
    let h=75+(i*31%95),y=425-h;
    ctx.fillStyle="#111e2a";ctx.fillRect(x-6,y-7,100,h+7);
    let mg=ctx.createLinearGradient(x,0,x+90,0);
    mg.addColorStop(0,"#273b4c");mg.addColorStop(.5,"#506579");mg.addColorStop(1,"#1b2d3d");
    ctx.fillStyle=mg;ctx.fillRect(x,y,88,h);
    ctx.fillStyle="#132d3e";ctx.fillRect(x+12,y+14,30,22);
    ctx.fillStyle="#54d9ee";ctx.shadowColor="#54d9ee";ctx.shadowBlur=10;ctx.fillRect(x+17,y+20,19,4);ctx.shadowBlur=0;
    ctx.fillStyle=i%2?"#e84b38":"#ffc247";ctx.beginPath();ctx.arc(x+67,y+23,6,0,7);ctx.fill();
  }

  // laser-warning signage on the back wall
  for(let i=0;i<4;i++){
    let x=130+i*280-(world*.4%280);
    ctx.fillStyle="#101b27";ctx.fillRect(x,290,78,28);
    ctx.fillStyle="#f3bd3e";ctx.font="bold 12px Arial";ctx.fillText("DANGER",x+10,309);
  }
  drawFloor();
}
function pipe(x,y,h,c){
  ctx.fillStyle="#17252b";ctx.fillRect(x,y+5,1500,h+6);
  let m=ctx.createLinearGradient(0,y,0,y+h);
  m.addColorStop(0,"#d0d6d4");m.addColorStop(.3,c);m.addColorStop(1,"#27373d");
  ctx.fillStyle=m;ctx.fillRect(x,y,1500,h);
  ctx.fillStyle="#d1d7d5";
  for(let i=0;i<1500;i+=100)ctx.fillRect(x+i,y-4,8,h+8);
}
function drawFloor(){
  let g=ctx.createLinearGradient(0,FLOOR,0,H);
  g.addColorStop(0,"#667987");g.addColorStop(.18,"#344757");g.addColorStop(1,"#101b27");
  ctx.fillStyle=g;ctx.fillRect(0,FLOOR,W,H-FLOOR);
  ctx.fillStyle="#111b27";ctx.fillRect(0,FLOOR-13,W,31);
  ctx.fillStyle="#a6b5bd";ctx.fillRect(0,FLOOR-15,W,4);

  // faixa de segurança amarela e preta
  ctx.save();
  ctx.beginPath();ctx.rect(0,FLOOR-12,W,28);ctx.clip();
  ctx.fillStyle="#eab43a";
  for(let x=-70;x<W+100;x+=70){
    let px=x-world*1.25%70;
    ctx.beginPath();ctx.moveTo(px,FLOOR-12);ctx.lineTo(px+35,FLOOR-12);
    ctx.lineTo(px+5,FLOOR+16);ctx.lineTo(px-30,FLOOR+16);ctx.closePath();ctx.fill();
  }
  ctx.restore();

  // roletes e parafusos do piso
  for(let x=0;x<W+40;x+=40){
    let px=x-world*1.6%40;
    ctx.fillStyle="#a9b7be";ctx.beginPath();ctx.arc(px,FLOOR+22,8,0,7);ctx.fill();
    ctx.fillStyle="#263746";ctx.beginPath();ctx.arc(px,FLOOR+22,4,0,7);ctx.fill();
  }
  ctx.fillStyle="#182633";ctx.fillRect(0,FLOOR+42,W,5);
}

/* ---------- PERSONAGEM (estilo Barry Steakfries) ---------- */
function createPlayer(){player={x:170,y:GY,vy:0,radius:20,anim:0,grounded:true,sq:0,blink:0}}

function limb(p,w,c){
  ctx.strokeStyle=c;ctx.lineWidth=w;ctx.lineCap=ctx.lineJoin="round";
  ctx.beginPath();ctx.moveTo(p[0],p[1]);
  for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i],p[i+1]);
  ctx.stroke();
}
function boot(x,y,a){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  ctx.fillStyle="#6a4426";ctx.beginPath();ctx.roundRect(-6,-5,18,11,4);ctx.fill();
  ctx.lineWidth=2.5;ctx.strokeStyle="#1a1410";ctx.stroke();
  ctx.fillStyle="#2b1c10";ctx.fillRect(-5,3,16,3);
  ctx.fillStyle="#9a6d3e";ctx.fillRect(-2,-3,7,2);
  ctx.restore();
}
function drawPlayer(){
  const SKIN="#f2bd91",SHIRT="#344f69",SHIRT2="#1e344b",PANTS="#725035",PANTS2="#513923",HAIR="#6b3824",HAIR2="#a5683b",OUT="#17151a";
  player.anim+=player.grounded?.3:.22;
  const t=player.anim,leg=Math.sin(t)*13,s=Math.sin(t)*6,hf=Math.sin(t*1.7)*2.5;
  if(player.sq>0)player.sq--;
  if(player.blink>0)player.blink--;else if(Math.random()<.012)player.blink=6;
  const L=(p,w,c)=>{limb(p,w+3.5,OUT);limb(p,w,c)};
  const ol=(w=2.5)=>{ctx.lineWidth=w;ctx.strokeStyle=OUT;ctx.lineJoin="round";ctx.stroke()};
  let hgt=Math.max(0,Math.min(1,(FLOOR-player.y)/400));
  ctx.fillStyle="rgba(0,0,0,"+(.35-hgt*.25)+")";
  ctx.beginPath();ctx.ellipse(player.x,FLOOR+4,26-hgt*10,6,0,0,7);ctx.fill();

  ctx.save();ctx.translate(player.x,player.y);
  if(!player.grounded)ctx.rotate(Math.max(-.3,Math.min(.3,player.vy*.03))+.08);
  if(player.sq>0){ctx.translate(0,39);ctx.scale(1+player.sq*.03,1-player.sq*.04);ctx.translate(0,-39)}

  // perna de trás
  if(player.grounded){L([-2,12,-8+leg,26,-14+leg,36],11,PANTS2);boot(-12+leg,37,.1)}
  else{L([-2,12,-9+s,26,-20+s*1.5,34],11,PANTS2);boot(-21+s*1.5,35,-.4)}
  // braço de trás
  if(player.grounded){let a=leg*.6;L([-6,-8,-12-a,0,-10-a*1.3,9],8,SKIN)}
  else{let a=Math.sin(t*1.4)*5;L([-6,-8,-14,-14+a,-22,-22+a],8,SKIN);ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(-22,-22+a,5.5,0,7);ctx.fill();ol(2)}

  // brilho da mochila
  if(flying){
    let gl=ctx.createRadialGradient(-20,32,2,-20,40,48);
    gl.addColorStop(0,"rgba(255,170,60,.6)");gl.addColorStop(1,"rgba(255,100,20,0)");
    ctx.fillStyle=gl;ctx.fillRect(-75,-10,110,110);
  }
  // mochila a jato
  let mg=ctx.createLinearGradient(-30,0,-8,0);
  mg.addColorStop(0,"#f0f2e9");mg.addColorStop(.5,"#8799a3");mg.addColorStop(1,"#293d4b");
  ctx.fillStyle=mg;ctx.beginPath();ctx.roundRect(-30,-14,11,36,5);ctx.roundRect(-20,-11,11,36,5);ctx.fill();ol();
  ctx.fillStyle="rgba(255,255,255,.55)";ctx.fillRect(-28,-10,2,26);ctx.fillRect(-18,-7,2,26);
  ctx.fillStyle="#f4b92f";ctx.fillRect(-30,-3,11,5);ctx.fillRect(-20,0,11,5);
  ctx.fillStyle="#ffd34d";for(let i=0;i<4;i++)ctx.fillRect(-28,6+i*4,7,2.5);
  ctx.fillStyle=flying?"#7dff7a":"#ff5a3c";ctx.beginPath();ctx.arc(-14.5,14,2,0,7);ctx.fill();
  ctx.fillStyle="#2a363c";
  ctx.beginPath();ctx.moveTo(-29,22);ctx.lineTo(-20,22);ctx.lineTo(-22,29);ctx.lineTo(-27,29);ctx.fill();ol(2);
  ctx.beginPath();ctx.moveTo(-19,25);ctx.lineTo(-10,25);ctx.lineTo(-12,32);ctx.lineTo(-17,32);ctx.fill();ol(2);
  if(flying){
    for(const nx of[-24.5,-14.5]){
      let ny=nx<-20?29:32,f=14+Math.random()*12;
      ctx.fillStyle="#f23b17";ctx.beginPath();ctx.moveTo(nx-4,ny);ctx.lineTo(nx+4,ny);ctx.lineTo(nx-2,ny+f+9);ctx.fill();
      ctx.fillStyle="#ffae25";ctx.beginPath();ctx.moveTo(nx-3,ny);ctx.lineTo(nx+3,ny);ctx.lineTo(nx-1,ny+f);ctx.fill();
      ctx.fillStyle="#fff3b0";ctx.beginPath();ctx.arc(nx,ny+2,3,0,7);ctx.fill();
    }
  }

  // torso
  let tg=ctx.createLinearGradient(-13,0,15,0);tg.addColorStop(0,SHIRT);tg.addColorStop(.6,SHIRT);tg.addColorStop(1,SHIRT2);
  ctx.fillStyle=tg;ctx.beginPath();ctx.roundRect(-13,-15,28,26,7);ctx.fill();ol();
  ctx.strokeStyle=SHIRT2;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(1,-14);ctx.lineTo(4,-8);ctx.lineTo(8,-14);ctx.stroke();
  ctx.strokeRect(3,-3,8,7);
  ctx.beginPath();ctx.moveTo(-8,2);ctx.lineTo(-4,6);ctx.moveTo(-9,-4);ctx.lineTo(-5,-1);ctx.stroke();
  ctx.fillStyle=PANTS;ctx.beginPath();ctx.roundRect(-13,7,28,10,3);ctx.fill();ol(2);
  ctx.fillStyle="#2a1c10";ctx.fillRect(-12,7,26,3);
  ctx.fillStyle="#e9bd54";ctx.fillRect(0,7,6,3);

  // perna da frente
  if(player.grounded){L([6,12,13-leg,26,19-leg,36],11,PANTS);boot(23-leg,37,.1)}
  else{L([6,12,13-s,25,5-s*1.5,34],11,PANTS);boot(4-s*1.5,35,-.5)}

  // braço da frente
  if(player.grounded){
    let a=leg*.6;L([8,-8,14+a,0,19+a*1.3,8],8,SKIN);
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(19+a*1.3,9,5.5,0,7);ctx.fill();ol(2);
  }else{
    let a=Math.sin(t*1.4)*5;L([8,-8,18,-14-a,27,-18-a],8,SKIN);
    ctx.fillStyle=SKIN;ctx.beginPath();ctx.arc(27,-18-a,5.5,0,7);ctx.fill();ol(2);
  }
  ctx.fillStyle=SHIRT;ctx.beginPath();ctx.arc(-8,-9,6,0,7);ctx.fill();ol(2);
  ctx.beginPath();ctx.arc(10,-9,6,0,7);ctx.fill();ol(2);

  // pescoço e cabeça
  ctx.fillStyle=SKIN;ctx.fillRect(0,-20,10,8);
  ctx.beginPath();ctx.ellipse(5,-28,14,15,0,0,7);ctx.fill();ol();
  ctx.beginPath();ctx.ellipse(-8,-27,3.5,5,0,0,7);ctx.fill();ol(2);
  ctx.beginPath();ctx.ellipse(19,-25,4,3.5,0,0,7);ctx.fill();ol(2);
  ctx.fillStyle="rgba(255,110,90,.35)";ctx.beginPath();ctx.ellipse(12,-19,3.5,2.5,0,0,7);ctx.fill();

  // cabelo bagunçado (balança com o vento)
  ctx.fillStyle=HAIR;
  ctx.beginPath();ctx.arc(4,-31,15,Math.PI*.95,Math.PI*2.1);ctx.fill();ol();
  const sp=[[-9,-30,-23,-30,-10,-39],[-6,-40,-18,-47,-1,-45],[1,-44,0,-56,9,-45],[8,-44,16,-54,15,-42],[13,-40,24,-45,18,-34]];
  sp.forEach((q,i)=>{
    let d=hf*(i<2?1.4:.5);
    ctx.beginPath();ctx.moveTo(q[0],q[1]);ctx.lineTo(q[2]-d,q[3]+d*.4);ctx.lineTo(q[4],q[5]);ctx.closePath();ctx.fill();ol(2);
  });
  ctx.strokeStyle=HAIR2;ctx.lineWidth=2;ctx.beginPath();
  ctx.moveTo(-2,-41);ctx.lineTo(5,-43);ctx.moveTo(8,-40);ctx.lineTo(14,-41);ctx.moveTo(-6,-36);ctx.lineTo(-1,-38);ctx.stroke();

  // olho, sobrancelha e boca
  if(player.blink>0){
    ctx.strokeStyle=OUT;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(8,-29);ctx.lineTo(16,-29);ctx.stroke();
  }else{
    ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(12,-29,4.8,5.8,0,0,7);ctx.fill();ol(1.5);
    ctx.fillStyle=OUT;ctx.beginPath();ctx.arc(13.8,-28.5,2.6,0,7);ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(14.6,-29.6,.9,0,7);ctx.fill();
  }
  ctx.strokeStyle=HAIR;ctx.lineWidth=3;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(7,-36);ctx.lineTo(17,flying?-38:-35);ctx.stroke();
  if(flying){
    ctx.fillStyle="#6b1a1a";ctx.beginPath();ctx.ellipse(13,-20,6.5,5.5,0,0,Math.PI);ctx.fill();ol(1.5);
    ctx.fillStyle="#fff";ctx.fillRect(7.5,-20,11,2.3);
    ctx.fillStyle="#d9606a";ctx.beginPath();ctx.ellipse(13,-15.5,3.2,1.8,0,0,7);ctx.fill();
  }else{
    ctx.strokeStyle="#7a3b2a";ctx.lineWidth=2;ctx.beginPath();ctx.arc(12,-22,5,.2,Math.PI-.5);ctx.stroke();
  }
  ctx.restore();
}

/* ---------- BALAS DA MOCHILA ---------- */
function updateBullets(dt){
  if(flying&&frame%3===0)
    bullets.push({x:player.x-24,y:player.y+34,vy:10+Math.random()*3});
  if(flying&&frame%2===0)particles.push({x:player.x-24,y:player.y+38,vx:-speed*.5-Math.random()*1.5,vy:1+Math.random()*1.5,life:24,color:"#b5bec1"});
  bullets=bullets.filter(b=>{
    b.y+=b.vy*dt;b.x-=speed*dt;
    if(b.y>=FLOOR-8){explosion(b.x,FLOOR-10,"#ffd45d",3);return false}
    return true;
  });
}
function drawBullets(){
  ctx.fillStyle="#ffe27a";
  bullets.forEach(b=>ctx.fillRect(b.x-1.5,b.y,3,10));
}

/* ---------- LASERS E FOGUETES ---------- */
function createObstacle(){
  // Apenas dois perigos: lasers e foguetes. Não há mais máquinas bloqueando o caminho.
  if(Math.random()<0.55){
    // Laser vertical com emissores metálicos.
    let y=85+Math.random()*260;
    let height=95+Math.random()*55;
    obstacles.push({type:"laser",x:W+35,y,width:12,height,warning:0});
  }else{
    // Foguete que atravessa a tela na altura indicada.
    let y=105+Math.random()*285;
    obstacles.push({type:"rocket",x:W+55,y,width:68,height:26,warning:18});
  }
}

function drawObstacles(){
  obstacles.forEach(o=>{
    if(o.type==="laser"){
      // Suportes do laser
      ctx.fillStyle="#26343b";
      ctx.fillRect(o.x-9,o.y-12,30,12);
      ctx.fillRect(o.x-9,o.y+o.height,30,12);
      ctx.fillStyle="#9aa8ad";
      ctx.fillRect(o.x-5,o.y-9,22,4);
      ctx.fillRect(o.x-5,o.y+o.height+5,22,4);

      // Feixe brilhante
      ctx.save();
      ctx.shadowColor="#ff174f";
      ctx.shadowBlur=24;
      ctx.fillStyle="#ff174f";
      ctx.fillRect(o.x,o.y,o.width,o.height);
      ctx.fillStyle="#ffd5df";
      ctx.fillRect(o.x+4,o.y,4,o.height);
      ctx.restore();

      // Pequenas luzes de aviso
      ctx.fillStyle="#ff334f";
      ctx.beginPath();
      ctx.arc(o.x+7,o.y-15,4,0,Math.PI*2);
      ctx.fill();
    }else if(o.type==="rocket"){
      // Fumaça e chama da cauda
      ctx.save();
      ctx.translate(o.x,o.y);
      ctx.fillStyle="#6b7478";
      ctx.globalAlpha=.65;
      ctx.beginPath();
      ctx.ellipse(-17,13,18,6,0,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;

      ctx.fillStyle="#ff6a21";
      ctx.beginPath();
      ctx.moveTo(-24,8);ctx.lineTo(-43,13);ctx.lineTo(-24,18);
      ctx.closePath();ctx.fill();
      ctx.fillStyle="#ffd45d";
      ctx.beginPath();
      ctx.moveTo(-24,10);ctx.lineTo(-36,13);ctx.lineTo(-24,16);
      ctx.closePath();ctx.fill();

      // Corpo do foguete
      let rg=ctx.createLinearGradient(0,0,0,26);
      rg.addColorStop(0,"#f4f5f2");
      rg.addColorStop(.5,"#aeb9bd");
      rg.addColorStop(1,"#66747a");
      ctx.fillStyle=rg;
      ctx.beginPath();
      ctx.roundRect(-25,3,48,20,9);
      ctx.fill();

      // Ponta
      ctx.fillStyle="#d94b37";
      ctx.beginPath();
      ctx.moveTo(22,3);ctx.lineTo(39,13);ctx.lineTo(22,23);
      ctx.closePath();ctx.fill();

      // Aletas
      ctx.fillStyle="#b9362b";
      ctx.beginPath();
      ctx.moveTo(-17,4);ctx.lineTo(-27,-4);ctx.lineTo(-8,4);
      ctx.closePath();ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-17,22);ctx.lineTo(-27,30);ctx.lineTo(-8,22);
      ctx.closePath();ctx.fill();

      // Janela e faixa
      ctx.fillStyle="#263d4a";
      ctx.beginPath();ctx.arc(7,13,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#8eeaff";
      ctx.beginPath();ctx.arc(8,12,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle="#e84b39";
      ctx.fillRect(-13,5,5,16);
      ctx.restore();
    }
  });
}

/* ---------- MOEDAS E PARTÍCULAS ---------- */
function createCoins(){
  let y=100+Math.random()*290;
  for(let i=0;i<5;i++)coins.push({x:W+i*42,y:y+Math.sin(i)*17,radius:12,rot:0});
}
function drawCoins(){
  coins.forEach(c=>{
    c.rot+=.12;
    ctx.save();ctx.translate(c.x,c.y);
    ctx.fillStyle="#ffbb28";ctx.strokeStyle="#fff2a3";ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,Math.max(3,Math.abs(Math.cos(c.rot)*11)),12,0,0,7);
    ctx.fill();ctx.stroke();ctx.restore();
  });
}
function explosion(x,y,color,n=15){
  for(let i=0;i<n;i++){
    let a=Math.random()*Math.PI*2,f=2+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*f,vy:Math.sin(a)*f,life:30,color});
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.life--;
  });
  ctx.globalAlpha=1;
  particles=particles.filter(p=>p.life>0);
}

/* ---------- COLISÕES ---------- */
function checkCollision(){
  for(const o of obstacles){
    if(o.type==="laser"){
      const hx=player.x+14>o.x && player.x-14<o.x+o.width;
      const hy=player.y+20>o.y && player.y-22<o.y+o.height;
      if(hx&&hy)return true;
    }else if(o.type==="rocket"){
      // Caixa de colisão um pouco menor que o desenho para deixar o jogo justo.
      const px=player.x-13, py=player.y-20, pw=27, ph=38;
      const rx=o.x-23, ry=o.y+4, rw=58, rh=18;
      if(px<rx+rw && px+pw>rx && py<ry+rh && py+ph>ry)return true;
    }
  }
  return false;
}
function collectCoins(){
  coins=coins.filter(c=>{
    if(Math.hypot(player.x-c.x,player.y-c.y)<player.radius+c.radius+6){
      money++;explosion(c.x,c.y,"#ffda45");return false;
    }
    return true;
  });
}

/* ---------- JOGO ---------- */
function updateHUD(){
  $("score").textContent=Math.floor(score);
  $("coins").textContent=money;
  $("record").textContent=record;
}
function resetGame(){
  createPlayer();
  obstacles=[];coins=[];particles=[];bullets=[];
  score=0;money=0;speed=5;frame=0;world=0;
  updateHUD();
}
function startGame(){
  resetGame();
  playing=true;paused=false;flying=false;
  overlay.style.display="none";
  pauseBtn.style.display="block";pauseBtn.textContent="Ⅱ PAUSAR";
  lastTime=performance.now();
  requestAnimationFrame(loop);
}
function gameOver(){
  playing=false;flying=false;
  let total=Math.floor(score)+money*10;
  if(total>record){record=total;try{localStorage.setItem("factoryRecord",record)}catch(e){}}
  updateHUD();
  $("title").textContent="FUGA INTERROMPIDA!";
  $("message").innerHTML="A fábrica venceu desta vez!<br><br>⭐ Pontuação: <b>"+Math.floor(score)+"</b><br>🪙 Moedas: <b>"+money+"</b><br>🏆 Total (pontos + moedas×10): <b>"+total+"</b>";
  $("start").textContent="TENTAR NOVAMENTE";
  overlay.style.display="flex";pauseBtn.style.display="none";
  draw();
}
function togglePause(){
  if(!playing)return;
  paused=!paused;
  if(paused){
    flying=false;
    pauseBtn.textContent="▶ CONTINUAR";
    $("title").textContent="JOGO PAUSADO";
    $("message").textContent="Sua fuga está pausada. Continue quando quiser.";
    $("start").textContent="CONTINUAR";
    overlay.style.display="flex";
  }else{
    overlay.style.display="none";
    pauseBtn.textContent="Ⅱ PAUSAR";
    lastTime=performance.now();
    requestAnimationFrame(loop);
  }
}

function update(dt){
  frame++;world+=speed*dt;
  score+=.13*dt;speed=Math.min(9,5+score/100);
  player.vy+=(flying?-.68:.48)*dt;
  player.vy=Math.max(-7,Math.min(7,player.vy));
  player.y+=player.vy*dt;
  if(player.y>=GY){if(!player.grounded&&player.vy>3)player.sq=8;player.y=GY;player.vy=0;player.grounded=true}else player.grounded=false;
  if(player.y<56){player.y=56;player.vy=0}
  if(frame%Math.max(58,Math.floor(112-speed*3))===0)createObstacle();
  if(frame%115===0)createCoins();
  obstacles.forEach(o=>{
    if(o.type==="rocket" && o.warning>0){o.warning-=dt;}
    else{o.x-=(o.type==="rocket"?speed+3:speed)*dt;}
  });
  coins.forEach(c=>c.x-=speed*dt);
  obstacles=obstacles.filter(o=>o.x>-120);
  coins=coins.filter(c=>c.x>-30);
  updateBullets(dt);
  if(checkCollision()){explosion(player.x,player.y,"#ff603d");gameOver();return}
  collectCoins();updateHUD();
}
function draw(){
  drawBackground();
  // brilho de luz quente para aproximar a atmosfera da capa
  let glow=ctx.createRadialGradient(150,330,15,150,330,260);
  glow.addColorStop(0,"rgba(255,151,45,.12)");
  glow.addColorStop(1,"rgba(255,151,45,0)");
  ctx.fillStyle=glow;ctx.fillRect(0,80,500,390);
  drawCoins();drawObstacles();drawBullets();drawParticles();drawPlayer();
  // vinheta discreta nas bordas
  let vignette=ctx.createRadialGradient(W/2,H/2,180,W/2,H/2,650);
  vignette.addColorStop(0,"rgba(0,0,0,0)");
  vignette.addColorStop(1,"rgba(0,0,0,.25)");
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
}
function loop(now){
  if(!playing||paused)return;
  let dt=Math.min((now-lastTime)/16.67,2);lastTime=now;
  update(dt);
  if(playing){draw();requestAnimationFrame(loop)}
}

/* ---------- CONTROLES ---------- */
$("start").addEventListener("click",()=>{paused?togglePause():startGame()});
pauseBtn.addEventListener("click",togglePause);
canvas.addEventListener("pointerdown",e=>{e.preventDefault();if(playing&&!paused)flying=true});
window.addEventListener("pointerup",()=>flying=false);
window.addEventListener("pointercancel",()=>flying=false);
window.addEventListener("blur",()=>{flying=false;if(playing&&!paused)togglePause()});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"){e.preventDefault();if(playing&&!paused)flying=true}
  if(e.code==="Escape"&&playing)togglePause();
});
window.addEventListener("keyup",e=>{if(e.code==="Space")flying=false});

resetGame();draw();
</script>
